<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-label="Onyx Foundry seven-color working palette">
  <rect width="980" height="360" fill="#101113"/>
  <text x="35" y="55" fill="#D5CEC3" font-size="30" font-family="serif">ONYX FOUNDRY</text>
  <text x="37" y="83" fill="#AAA49A" font-size="14" font-family="sans-serif">WORKING PALETTE · PROPOSED VALUES, NOT SAMPLED ARTWORK</text>
  <g font-family="sans-serif" font-size="14">
    <rect x="35" y="113" width="124" height="128" rx="7" fill="#101113" stroke="#AAA49A"/>
    <rect x="168" y="113" width="124" height="128" rx="7" fill="#292A2B"/>
    <rect x="301" y="113" width="124" height="128" rx="7" fill="#777774"/>
    <rect x="434" y="113" width="124" height="128" rx="7" fill="#D5CEC3"/>
    <rect x="567" y="113" width="124" height="128" rx="7" fill="#80563A"/>
    <rect x="700" y="113" width="124" height="128" rx="7" fill="#24539B"/>
    <rect x="833" y="113" width="112" height="128" rx="7" fill="#AAA49A"/>
    <g fill="#D5CEC3">
      <text x="35" y="267">Obsidian</text><text x="35" y="290">#101113</text>
      <text x="168" y="267">Charcoal</text><text x="168" y="290">#292A2B</text>
      <text x="301" y="267">Iron</text><text x="301" y="290">#777774</text>
      <text x="434" y="267">Pale Stone</text><text x="434" y="290">#D5CEC3</text>
      <text x="567" y="267">Walnut</text><text x="567" y="290">#80563A</text>
      <text x="700" y="267">Sapphire</text><text x="700" y="290">#24539B</text>
      <text x="833" y="267">Vein</text><text x="833" y="290">#AAA49A</text>
    </g>
  </g>
  <text x="35" y="334" fill="#AAA49A" font-size="13" font-family="sans-serif">Mostly matte stone and metal · walnut supplies warmth · sapphire is a restrained accent</text>
